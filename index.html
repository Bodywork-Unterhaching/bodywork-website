<script>
    const sheetId = '1PxFGtlsxI66o-jp3bW7sLaUkjck8dXdtb7C_xTrTGlw';
    const phone = '4915560764392';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

    const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

    function formatShortDate(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      return `${d}.${m}.`;
    }

    function getWeekRange(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      
      const monday = new Date(d.setDate(diffToMonday));
      const saturday = new Date(monday);
      saturday.setDate(monday.getDate() + 5);

      return {
        key: `${monday.getFullYear()}-${monday.getMonth()+1}-${monday.getDate()}`,
        mondayObj: monday,
        saturdayObj: saturday,
        label: `Woche vom ${formatShortDate(monday)} bis ${formatShortDate(saturday)}`
      };
    }

    async function loadSlots() {
      const container = document.getElementById('dynamic-weeks-container');
      try {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = data.split('\n').slice(1);

        const weeksMap = new Map();

        rows.forEach(row => {
          const cols = row.split(',').map(c => c.replace(/"/g, '').trim());
          if (cols.length >= 4) {
            const datumStr = cols[0];
            const start = cols[1];
            const ende = cols[2];
            const status = cols[3].toLowerCase();

            if (status === 'frei') {
              const parts = datumStr.split('.');
              if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10);
                const year = parseInt(parts[2], 10);
                const dateObj = new Date(year, month - 1, day);

                const weekInfo = getWeekRange(dateObj);

                if (!weeksMap.has(weekInfo.key)) {
                  weeksMap.set(weekInfo.key, {
                    info: weekInfo,
                    daysMap: new Map()
                  });
                }

                const weekEntry = weeksMap.get(weekInfo.key);
                const dayKey = datumStr;

                if (!weekEntry.daysMap.has(dayKey)) {
                  const wochentag = days[dateObj.getDay()];
                  weekEntry.daysMap.set(dayKey, {
                    wochentag,
                    datumKurz: `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.`,
                    datumFull: datumStr,
                    slots: []
                  });
                }

                const waText = `Hallo Rüdiger, ich möchte gerne folgenden Termin für 60 Min. Sportmassage buchen:\nDatum: ${days[dateObj.getDay()]}, ${datumStr}\nUhrzeit: ${start} - ${ende} Uhr\nBitte sende mir eine kurze Bestätigung.`;
                const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(waText)}`;

                weekEntry.daysMap.get(dayKey).slots.push({
                  start,
                  ende,
                  waUrl
                });
              }
            }
          }
        });

        container.innerHTML = '';

        if (weeksMap.size === 0) {
          container.innerHTML = '<div style="color: #666; font-size: 0.95rem;">Aktuell sind keine freien Termine verfügbar.</div>';
          return;
        }

        const sortedWeeks = Array.from(weeksMap.values()).sort((a, b) => a.info.mondayObj - b.info.mondayObj);

        sortedWeeks.forEach((week, index) => {
          const weekId = `week-group-${index}`;
          const isFirst = (index === 0);

          const btn = document.createElement('button');
          btn.className = isFirst ? 'week-toggle-btn active' : 'week-toggle-btn';
          btn.innerHTML = `<span>${week.info.label}</span>`;
          btn.onclick = () => toggleWeek(weekId, btn);

          const slotGroup = document.createElement('div');
          slotGroup.id = weekId;
          slotGroup.className = 'slot-group';
          if (isFirst) {
            slotGroup.style.display = 'flex';
          }

          const sortedDays = Array.from(week.daysMap.values());

          sortedDays.forEach(dayData => {
            const dayBlock = document.createElement('div');
            dayBlock.className = 'day-block';

            const dayTitle = document.createElement('div');
            dayTitle.className = 'day-title';
            dayTitle.textContent = `${dayData.wochentag}, ${dayData.datumKurz}`;
            dayBlock.appendChild(dayTitle);

            const timeGrid = document.createElement('div');
            timeGrid.className = 'time-grid';

            dayData.slots.forEach(slot => {
              const badge = document.createElement('a');
              badge.href = slot.waUrl;
              badge.target = '_blank';
              badge.className = 'time-badge';
              badge.textContent = `${slot.start} – ${slot.ende} Uhr`;
              timeGrid.appendChild(badge);
            });

            dayBlock.appendChild(timeGrid);
            slotGroup.appendChild(dayBlock);
          });

          container.appendChild(btn);
          container.appendChild(slotGroup);
        });

      } catch (err) {
        container.innerHTML = '<div style="color: #c53030; font-size: 0.95rem;">Fehler beim Laden der Termine.</div>';
      }
    }

    function toggleWeek(id, btnElement) {
      const el = document.getElementById(id);
      if (!el) return;
      
      const isHidden = window.getComputedStyle(el).display === 'none';
      if (isHidden) {
        el.style.display = 'flex';
        btnElement.classList.add('active');
      } else {
        el.style.display = 'none';
        btnElement.classList.remove('active');
      }
    }

    function toggleElement(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const currentDisplay = window.getComputedStyle(el).display;
      el.style.display = currentDisplay === 'none' ? 'block' : 'none';
    }

    loadSlots();
  </script>
