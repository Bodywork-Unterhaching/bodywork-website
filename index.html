<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodywork Unterhaching – Sport- & Wellnessmassagen</title>
  <style>
    :root {
      --primary: #1a1a1a;
      --accent: #2e4d46;
      --bg: #f8f6f0;
      --card-bg: #ededec;
      --text: #1a1a1a;
      --subtext: #4a4a4a;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--bg); color: var(--text);
      line-height: 1.5;
    }
    header {
      background-color: var(--bg); color: var(--primary);
      text-align: center; padding: 40px 25px 25px 25px;
      max-width: 750px; margin: 0 auto; box-sizing: border-box;
    }
    header h1 {
      margin: 0; font-size: 2.5rem; font-weight: 800; line-height: 1.1; letter-spacing: -0.5px;
    }
    .header-logo {
      max-width: 180px;
      width: 100%;
      height: auto;
      margin: 15px auto;
      display: block;
    }
    header .subtitle {
      font-size: 1.3rem; margin-top: 8px; margin-bottom: 25px; font-weight: 500; color: var(--primary);
    }
    header .location-info {
      font-size: 1.05rem; line-height: 1.45; color: var(--primary); max-width: 650px; margin: 0 auto;
    }
    nav {
      background: var(--accent); display: flex; justify-content: center;
      gap: 15px; padding: 14px; position: sticky; top: 0; z-index: 100; flex-wrap: wrap;
    }
    nav a { color: white; text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .container { max-width: 750px; margin: 0 auto; padding: 25px 20px; }
    section {
      background: #ffffff; border-radius: 12px;
      padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    h2 { color: var(--primary); margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 10px; font-size: 1.6rem; }
    .price-list { display: flex; flex-direction: column; gap: 20px; }
    .price-item { border-left: 4px solid var(--accent); padding-left: 12px; }
    .price-item h3 { margin: 0 0 5px 0; color: var(--primary); }
    .profile-container { text-align: center; margin-bottom: 20px; }
    .profile-img {
      width: 180px; height: 180px; object-fit: cover;
      border-radius: 50%; border: 4px solid var(--accent); box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    }
    .slot-btn {
      display: inline-block;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    footer { text-align: center; padding: 25px; font-size: 0.85rem; color: var(--subtext); }
    .legal-content { display: none; font-size: 0.85rem; margin-top: 15px; text-align: left; }
    button.legal-btn {
      background: #e5e3dc; border: 1px solid #d0cecf; padding: 8px 12px;
      border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <h1>Bodywork<br>Unterhaching</h1>
    
    <img src="logo.png" alt="Bodywork Unterhaching Logo" class="header-logo">
    
    <div class="subtitle">Sport- und Wellnessmassagen</div>
    <div class="location-info">
      Behandlungen finden in einer Praxis in unmittelbarer Nähe des Unterhachinger Freibads / Grünauer Allee statt. Der genaue Standort folgt nach der Buchung.
    </div>
  </header>

  <nav>
    <a href="#termine">Termine</a>
    <a href="#weitere-massagen">Weitere Massagen</a>
    <a href="#ueber-mich">Über mich</a>
    <a href="#gutscheine">Gutscheine</a>
    <a href="#rechtliches">Rechtliches</a>
  </nav>

  <div class="container">
    
    <section id="termine" style="padding: 0; background: transparent; box-shadow: none;">
      <div style="background-color: var(--card-bg); padding: 35px 25px; border-radius: 12px; text-align: center; max-width: 100%; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
